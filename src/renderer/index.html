<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Conciliador de Fichas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CF</div>
        <div>
          <div class="brand-name">Conciliador</div>
          <div class="brand-sub">Fichas vs. billeteras</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main>
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="view-title"></h1>
          <div class="muted" id="view-sub"></div>
        </div>
        <div class="topbar-right" id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script src="app.js"></script>
  </body>
</html>
